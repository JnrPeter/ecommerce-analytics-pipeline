version: 2

models:
  - name: dim_customers
    description: "Customer dimension (SCD Type 1 - latest state only)"
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_retailers
    description: "Retailer dimension (SCD Type 2 - tracks zone, status, and name changes over time via dbt snapshots)"
    columns:
      - name: retailer_key
        tests: [unique, not_null]
      - name: retailer_id
        tests: [not_null]

  - name: dim_products
    description: "Product dimension (SCD Type 2 - tracks price changes over time via dbt snapshots)"
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]

  - name: fct_orders
    description: "Fact table of all orders with financial and delivery performance fields (incremental, merge on order_id)"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: total_amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
      - name: delivery_performance
        tests:
          - accepted_values:
              values: ['on_time', 'slightly_late', 'late', 'very_late']
              config:
                where: "delivery_performance is not null"

  - name: fct_order_items
    description: "Fact table of all order line items (incremental, merge on item_id)"
    columns:
      - name: item_id
        tests: [unique, not_null]

  - name: fct_daily_zone_summary
    description: "Daily aggregated metrics by zone: revenue, delivery performance, ratings, payment mix"

  - name: fct_retailer_performance
    description: "Retailer-level lifetime metrics: revenue, order count, delivery SLA, average rating"

  - name: fct_payment_channel_summary
    description: "Daily aggregated metrics by payment method and order channel"
